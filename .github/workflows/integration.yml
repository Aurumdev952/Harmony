name: Integration

on:
  # Trigger on all pull requests.
  pull_request:

permissions: {}

# A new push to a PR cancels the run still going for the previous one.
concurrency:
  group: integration-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  python:
    name: Python 3.9 - lint, types, tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The PR merge commit and its first parent, the base, for the changed-file diff.
          fetch-depth: 2
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.5'
          enable-cache: true
          cache-suffix: app39
      - name: Lockfiles match pyproject.toml
        run: |
          uv lock --check
          uv lock --check --project ci/tools313
      - name: Install
        run: uv sync --locked
      - name: Pipeline suite tools
        # tests/pipeline runs the Zeus steps, which shell out to lz4, lz4cat and pigz.
        # Installed before the linters so a lint failure cannot skip it.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends lz4 pigz
      - name: Ruff
        env:
          RUFF_OUTPUT_FORMAT: github
        run: ci/lint_python.sh HEAD^1
      - name: Mypy
        # Run it even if ruff fails, so we can see all the errors at once.
        if: '!cancelled()'
        run: uv run --locked mypy
      - name: Pytest
        # Every directory under tests/ runs, each in its own process; tests/infra
        # runs in the 3.13 job. The contract replay needs the compose stack: it
        # skips without CONTRACT_BASE_URL, and tests marked `stack` are deselected.
        if: '!cancelled()'
        run: ci/pytest_suites.sh

  python-313:
    name: Python 3.13 - standalone tools
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.5'
          enable-cache: true
          cache-suffix: tools313
      - name: Mypy (strict)
        run: uv run --project ci/tools313 --locked mypy --config-file ci/tools313/pyproject.toml
      - name: Pytest
        if: '!cancelled()'
        run: uv run --project ci/tools313 --locked pytest tests/infra

  lint-js:
    name: JS - Lint
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      matrix:
        node-version: ['18.17']
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: List changed files
        run: git -c core.quotePath=false diff --name-only --diff-filter=d HEAD^1 HEAD > "$RUNNER_TEMP/changed-files"
      - name: Use Node.js ${{ matrix.node-version }}
        id: setup-node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
      - name: Restore cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache-node_modules
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ steps.setup-node.outputs.node-version }}-node_modules-${{ hashFiles('package.json', 'yarn.lock') }}
      - name: Install dependencies
        if: steps.cache-node_modules.outputs.cache-hit != 'true'
        run: |
          yarn install
      - name: Cache dependencies
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.cache-node_modules.outputs.cache-hit != 'true'
        with:
          path: node_modules
          key: ${{ steps.cache-node_modules.outputs.cache-primary-key }}
      - name: Lint (.js, .jsx)
        # Only js and jsx files changed in this PR. The entire project isn't compliant.
        # eslint may have messages when there aren't warnings/errors, so check the counts explicitly.
        run: |
          mapfile -t changed_files < <(grep -E '\.jsx?$' "$RUNNER_TEMP/changed-files" | grep -v '^web/public/' || true)
          if (( ${#changed_files[@]} )); then
            echo "eslint evaluating: ${changed_files[*]}"
            eslint_report=$(./node_modules/.bin/eslint -f json -- "${changed_files[@]}") || true
            jq -r '.[] | "::warning file=" + .filePath + (.messages | .[] | ",line=" + (.line|tostring) + ",col=" + (.column|tostring) + ",title=" + .ruleId + "::" + .message)' <<<"$eslint_report"
            fail=$(jq -r '[.[] | select(.warningCount > 0 or .errorCount > 0)] | length > 0' <<<"$eslint_report")
            if [ "$fail" = "true" ]; then
              echo "$eslint_report"
              exit 1
            fi
          else
            echo "no .js or .jsx files found for eslint to evaluate"
          fi
      - name: Lint (.scss)
        # Only scss files changed in this PR. The entire project isn't compliant.
        run: |
          mapfile -t changed_files < <(grep -E '\.scss$' "$RUNNER_TEMP/changed-files" || true)
          if (( ${#changed_files[@]} )); then
            echo "stylelint evaluating: ${changed_files[*]}"
            ./node_modules/stylelint/bin/stylelint.js -- "${changed_files[@]}"
          else
            echo "no .scss files found for stylelint to evaluate"
          fi
