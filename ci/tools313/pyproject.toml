# Locked tools for the CPython 3.13 lane: the standalone PEP 723 scripts
# (prod/browser_share, docker/export_requirements.py) and their tests in tests/infra.
# The app stays on 3.9 until WP-3b, which folds this lane into the root project.
#
#   uv run --project ci/tools313 --locked pytest tests/infra
[project]
name = "harmony-tools313"
version = "0"
requires-python = "==3.13.*"
dependencies = []

[dependency-groups]
dev = ["pytest==9.1.1", "mypy==2.4.0", "pyyaml==6.0.3"]

[tool.uv]
package = false

# Used with `mypy --config-file ci/tools313/pyproject.toml`, so the root project's
# 3.9 settings (sqlmypy plugin, app packages) do not apply.
[tool.mypy]
files = ["prod/browser_share/browser_share.py", "docker/export_requirements.py"]
strict = true
explicit_package_bases = true
