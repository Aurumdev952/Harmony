# WP-0k unit 1 scratch overlay (not committed): production's nginx-proxy in
# front of web, configured as docker-compose.yaml configures it.
services:
  nginx:
    image: nginxproxy/nginx-proxy:1.11.6-alpine@sha256:99376e95c8754547213d411222a2c4dca046d974e753ae2a1c9aef09b2c03364
    networks: [internal]
    volumes:
      - /run/user/1000/docker.sock:/tmp/docker.sock:ro
      - ./certs:/etc/nginx/certs:ro
  web:
    environment:
      VIRTUAL_HOST: real.org
      VIRTUAL_PORT: "5000"
      HSTS: "off"
      SSL_POLICY: Mozilla-Modern
      HTTPS_METHOD: redirect
  fwd-http:
    image: python:3.12-slim@sha256:f77ac9e44ae96ef2c90b8053ea08c31f8be030f824196b0ae4db6d462c84e51f
    networks: [internal, edge]
    volumes:
      - ./port_forward.py:/forward/port_forward.py:ro
    environment: {FORWARD_TO_HOST: nginx, FORWARD_TO_PORT: "80"}
    command: ["python", "-u", "/forward/port_forward.py"]
    ports: ["127.0.0.1:58842:5000"]
    depends_on: [nginx]
  fwd-https:
    image: python:3.12-slim@sha256:f77ac9e44ae96ef2c90b8053ea08c31f8be030f824196b0ae4db6d462c84e51f
    networks: [internal, edge]
    volumes:
      - ./port_forward.py:/forward/port_forward.py:ro
    environment: {FORWARD_TO_HOST: nginx, FORWARD_TO_PORT: "443"}
    command: ["python", "-u", "/forward/port_forward.py"]
    ports: ["127.0.0.1:58843:5000"]
    depends_on: [nginx]
