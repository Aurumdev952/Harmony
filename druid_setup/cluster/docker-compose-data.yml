version: "2.2"

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "50m"
    max-file: "10"

volumes:
  zen_extensions: {}
  middle_var: {}
  historical_var: {}

services:
  extension_loader:
    build:
      context: ../extensions
    volumes:
      - zen_extensions:/druid/extensions
    logging: *default-logging

  historical:
    image: apache/druid:0.23.0@sha256:ed9719968b4be3a2f1643907a1a5a5814e2ee1215f3604da8b2da2ac05f65912
    container_name: historical
    restart: always
    volumes:
      - ${DRUID_SHARED_FOLDER:-/home/share}:/home/share
      - ${DATA_OUTPUT_FOLDER:-/data/output}:/data/output
      - historical_var:/opt/druid/var
      - zen_extensions:/var/lib/zen/extensions/
    depends_on:
      - extension_loader
    # Druid runs without authentication: private address only, firewalled to
    # the other Druid hosts.
    ports:
      - "${DRUID_DATA_HOST:?set DRUID_DATA_HOST to this host's private IP}:8083:8083"
    command:
      - historical
    env_file:
      - environment/common.env
      - environment/historical.env
    environment:
      - druid_host=${DRUID_DATA_HOST}
      - druid_zk_service_host=${DRUID_ZOOKEEPER_HOST}
    logging: *default-logging

  middlemanager:
    image: apache/druid:0.23.0@sha256:ed9719968b4be3a2f1643907a1a5a5814e2ee1215f3604da8b2da2ac05f65912
    container_name: middlemanager
    restart: always
    volumes:
      - ${DRUID_SHARED_FOLDER:-/home/share}:/home/share
      - ${DATA_OUTPUT_FOLDER:-/data/output}:/data/output
      - middle_var:/opt/druid/var
      - zen_extensions:/var/lib/zen/extensions/
    depends_on:
      - extension_loader
    ports:
      - "${DRUID_DATA_HOST:?set DRUID_DATA_HOST to this host's private IP}:8091:8091"
      - "${DRUID_DATA_HOST:?set DRUID_DATA_HOST to this host's private IP}:8100-8105:8100-8105"
    command:
      - middleManager
    env_file:
      - environment/common.env
      - environment/middlemanager.env
    environment:
      - druid_zk_service_host=${DRUID_ZOOKEEPER_HOST}
    logging: *default-logging
