version: "2.2"

volumes:
  zen_extensions: {}
  zookeeper_data: {}
  zookeeper_datalog: {}
  zookeeper_logs: {}
  metadata_data: {}
  middle_var: {}
  historical_var: {}
  broker_var: {}
  coordinator_var: {}
  router_var: {}

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "50m"
    max-file: "10"

services:
  extension_loader:
    build:
      context: ../extensions
    volumes:
      - zen_extensions:/druid/extensions
    logging: *default-logging

  postgres:
    # A data volume only starts under the Postgres major that created it
    # (`docker compose exec postgres cat /var/lib/postgresql/data/PG_VERSION`).
    # This used to be `postgres:latest`, so existing hosts may be on 14, 15 or
    # 16; set DRUID_POSTGRES_IMAGE in druid_setup/.env to the matching line:
    #   postgres:16.15-bookworm@sha256:efedf3595f1d6f415c08568ba171029bf54052e754cc9f030e3f2412b21f3d67
    #   postgres:15.19-bookworm@sha256:539ceaaae49b3a7c8a04467cf00cc6788d8e3f1675df41860d86eebc4c40524f
    #   postgres:14.24-bookworm@sha256:dcc2ca942d8518144f387a0c2630188427835f984caaed0418b986928e761809
    # Keep the Debian variant: Alpine sorts text differently and would
    # invalidate the existing indexes. 18+ needs a different volume path.
    image: ${DRUID_POSTGRES_IMAGE:-postgres:17.11-bookworm@sha256:639ab7ceb90e13123085b741fb31ef493fba25463002f6da665352e7b534b652}
    restart: always
    # Not published: only the coordinator connects, over the Compose network.
    # For psql, use `docker compose exec postgres psql -U druid druid`.
    volumes:
      - metadata_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD=${DRUID_POSTGRES_PASSWORD:?set DRUID_POSTGRES_PASSWORD in druid_setup/.env to a random value, e.g. openssl rand -hex 32}
      - POSTGRES_USER=druid
      - POSTGRES_DB=druid
    logging: *default-logging

  memcache:
    container_name: memcache
    image: memcached:1.6.45@sha256:405a445c7c81bca205850426288baa5655c72859ae31d3de3fa823e6482be4ad
    restart: always
    # Not published: Druid reaches it as memcache:11211 on the Compose network.
    logging: *default-logging

  # Need 3.5 or later for container nodes
  zookeeper:
    container_name: zookeeper
    image: zookeeper:3.8.6@sha256:6abd40b410986c173db7b262ab429a658d1cfb808f72c0609980a564e284214e
    restart: always
    # Not published: Druid reaches it as zookeeper:2181 on the Compose network.
    volumes:
      - zookeeper_data:/data
      - zookeeper_datalog:/datalog
      - zookeeper_logs:/logs
    environment:
      - ZOO_MY_ID=1
    logging: *default-logging

  coordinator:
    platform: linux/amd64
    image: apache/druid:0.23.0@sha256:ed9719968b4be3a2f1643907a1a5a5814e2ee1215f3604da8b2da2ac05f65912
    container_name: coordinator
    restart: always
    volumes:
      - ${DRUID_SHARED_FOLDER:-/home/share}:/home/share
      - coordinator_var:/opt/druid/var
      - zen_extensions:/var/lib/zen/extensions/
    depends_on:
      - zookeeper
      - postgres
      - extension_loader
    # Druid runs without authentication. Publish only what web and the
    # pipeline call (coordinator, broker, router) and only on one address;
    # firewall it to those hosts. Historical and middlemanager stay internal.
    ports:
      - "${DRUID_BIND_ADDRESS:?set DRUID_BIND_ADDRESS to the address web and the pipeline use in DRUID_HOST}:8081:8081"
    command:
      - coordinator
    env_file:
      - environment/common.env
      - environment/coordinator.env
    environment:
      - DRUID_POSTGRES_PASSWORD=${DRUID_POSTGRES_PASSWORD:?set DRUID_POSTGRES_PASSWORD in druid_setup/.env to a random value, e.g. openssl rand -hex 32}
    logging: *default-logging

  broker:
    platform: linux/amd64
    image: apache/druid:0.23.0@sha256:ed9719968b4be3a2f1643907a1a5a5814e2ee1215f3604da8b2da2ac05f65912
    container_name: broker
    restart: always
    volumes:
      - broker_var:/opt/druid/var
      - zen_extensions:/var/lib/zen/extensions/
    depends_on:
      - zookeeper
      - postgres
      - memcache
      - coordinator
      - extension_loader
    ports:
      - "${DRUID_BIND_ADDRESS:?set DRUID_BIND_ADDRESS to the address web and the pipeline use in DRUID_HOST}:8082:8082"
    command:
      - broker
    env_file:
      - environment/common.env
      - environment/broker.env
    logging: *default-logging

  historical:
    platform: linux/amd64
    image: apache/druid:0.23.0@sha256:ed9719968b4be3a2f1643907a1a5a5814e2ee1215f3604da8b2da2ac05f65912
    container_name: historical
    restart: always
    volumes:
      - ${DRUID_SHARED_FOLDER:-/home/share}:/home/share
      - ${DATA_OUTPUT_FOLDER:-/data/output}:/data/output
      - historical_var:/opt/druid/var
      - zen_extensions:/var/lib/zen/extensions/
    depends_on:
      - zookeeper
      - postgres
      - memcache
      - coordinator
      - extension_loader
    command:
      - historical
    env_file:
      - environment/common.env
      - environment/historical.env
    logging: *default-logging

  middlemanager:
    platform: linux/amd64
    image: apache/druid:0.23.0@sha256:ed9719968b4be3a2f1643907a1a5a5814e2ee1215f3604da8b2da2ac05f65912
    container_name: middlemanager
    restart: always
    volumes:
      - ${DRUID_SHARED_FOLDER:-/home/share}:/home/share
      - ${DATA_OUTPUT_FOLDER:-/data/output}:/data/output
      - middle_var:/opt/druid/var
      - zen_extensions:/var/lib/zen/extensions/
    depends_on:
      - zookeeper
      - postgres
      - coordinator
      - extension_loader
    command:
      - middleManager
    env_file:
      - environment/common.env
      - environment/middlemanager.env
    logging: *default-logging

  router:
    platform: linux/amd64
    image: apache/druid:0.23.0@sha256:ed9719968b4be3a2f1643907a1a5a5814e2ee1215f3604da8b2da2ac05f65912
    container_name: router
    restart: always
    volumes:
      - router_var:/opt/druid/var
      - zen_extensions:/var/lib/zen/extensions/
    depends_on:
      - zookeeper
      - postgres
      - coordinator
      - extension_loader
    ports:
      - "${DRUID_BIND_ADDRESS:?set DRUID_BIND_ADDRESS to the address web and the pipeline use in DRUID_HOST}:8888:8888"
    command:
      - router
    env_file:
      - environment/common.env
      - environment/router.env
    logging: *default-logging
