[project]
name = "harmony"
version = "0"
# The one interpreter for the images, CI and development.
requires-python = "==3.13.*"
# Shared by the web server and the pipeline (exported to requirements.txt).
dependencies = [
    "setuptools==71.1.0",
    # Before 22.1, slotted classes (related.immutable) break zero-argument super()
    # on Python 3.11+; 24.1 is the first release supporting 3.13.
    "attrs==24.1.0",
    # Also pinned in the Dockerfiles; some installs need wheel before anything else.
    "wheel==0.43.0",
    "Cython<3.0.0",
    "celery==5.4.0",
    "Werkzeug==0.16.1",
    # 0.23 imports collections.Mapping, gone in Python 3.10. Jinja2 2.11 imports
    # markupsafe.soft_unicode, gone in 2.1.
    "MarkupSafe==2.0.1",
    # 1.0.2 imports collections.MutableMapping, gone in Python 3.10.
    "Flask==1.0.4",
    "Flask-Principal==0.4.0",
    # 2.5 passes alembic.command.current(head_only=), which alembic 1.5 removed, so
    # `flask db current` crashed on the locked alembic.
    "Flask-Migrate==2.7.0",
    "Flask-SQLAlchemy==2.4.0",
    "flask-user==0.6.21",
    # passlib 1.7.4 (via flask-user) raises on bcrypt >= 5.0; lift with WP-3d/WP-5d.
    "bcrypt==4.0.1",
    "WTForms==2.1",
    # Flask 1.0 needs Jinja2 2; 2.10 imports collections.Mapping, gone in 3.10.
    "Jinja2==2.11.3",
    # Later releases removed itsdangerous.json, which Flask 1.0 imports.
    "itsdangerous==2.0.1",
    "importlib_metadata<5",
    "ethiopian-date-converter==0.1.5",
    "hvac>=0.7.0",
    # The lowest releases with CPython 3.13 wheels (pandas 2.2 also needs numpy 2).
    "pandas==2.2.3",
    "psycopg2-binary==2.9.13",
    "python-dateutil>=2.8.1",
    "requests==2.28.1",
    "httpx[socks]==0.27.0",
    "six>=1.9.0",
    "stringcase==1.2.0",
    "toposort==1.5",
    "coloredlogs==5.0",
    "python-slugify",
    "retry>=0.9.2",
    "watchdog>=0.8.3",
    "pyyaml>=3.12",
    # botocore before 1.29 vendors a six whose importer Python 3.12 no longer calls.
    "boto3==1.43.108",
    "SQLAlchemy==1.3.24",
    "related>=0.7.0",
    "gspread>=5.4.0",
    "numpy==2.1.3",
    "python-nginx==1.2",
    # Our fork fixes response-schema inference from type annotations. The pipeline
    # needs it too, through the alerts code.
    "Flask-Potion",
    "pylib",
    # The 2017 commit pinned before subclassed collections.MutableSequence, gone in
    # Python 3.10. The golden suite shows 0.6.9 builds the same Druid queries.
    "pydruid==0.6.9",
    "python-rapidjson==1.17",
    "openpyxl>=3.0.9",
    # Works around https://github.com/lloyd/yajl/issues/130.
    "ijson-bigint==3.2.0.post1",
    "types-jsonschema==4.17.0.8",
    # 0.18 imports imp, gone in Python 3.12.
    "future==1.0.0",
]

[dependency-groups]
# Exported to requirements-web.txt.
web = [
    "flask-jwt-extended==3.25.1",
    "blinker==1.4",
    "flask-caching==2.0.1",
    "flask-login==0.4.1",
    "gunicorn[gevent]==20.0.4",
    "isodate>=0.5.4",
    "redis==5.0.1",
    "scipy>=1.2.1",
    "twilio==6.24.1",
    "PyJWT==1.7.1",
    "typing_extensions==4.1.1",
    "alembic>=1.7.1",
]
# Exported to requirements-pipeline.txt.
pipeline = [
    "xlrd>=1.0.0",
    "pyshp",
    "shapely==2.0.7",
    "pyproj==3.7.2",
    "contextlib2",
    "lxml",
    "oauthlib",
    "requests_oauthlib",
    "isoweek",
    "unidecode==1.1.1",
    "zeep==3.4.0",
    "scikit-learn>=0.21.3",
    "scipy>=1.2.1",
    "typing_extensions==4.1.1",
    "netCDF4",
    "dataclasses",
    "croniter==1.3.7",
    "lz4==4.4.5",
]
# Exported to requirements-dev.txt.
dev = [
    "pytest>=7.4.3",
    "pytest-flask>=0.15.0",
    "pytest-xdist>=1.29.0",
    "pytest-metadata>=1.8.0",
    "junit-xml>=1.9",
    "deepdiff==5.5.0",
    "ordered-set==4.0.2",
    "pytest-asyncio==0.20.3",
    "pytest-httpx==0.30.0",
    "freezegun==1.5.5",
    "hypothesis==6.91.0",
    "jsonschema==4.17.3",
    "pip-licenses==1.7.1",
    "termcolor==1.1.0",
    "googlemaps==4.2.0",
    "geopy==2.1.0",
    "ruff==0.16.10",
    "PyInstaller>=3.4",
    "pytest-env==0.6.2",
    "coverage==5.2.1",
    "pytest-picked==0.4.4",
    "mypy==1.3",
    "sqlalchemy-stubs==0.4",
    "types-botocore==1.0.2",
    "types-certifi==0.1.3",
    "types-Flask==0.1.2",
    "types-Jinja2==0.1.3",
    "types-jwt==0.1.3",
    "types-python-dateutil==0.1.2",
    "types-redis==0.1.17",
    "types-requests==0.1.8",
    "types-Werkzeug==0.1.8",
    "testfixtures==6.17.1",
    "alchemy-mock==0.4.3",
    "factory-boy==3.2.0",
]

[tool.uv]
package = false
# Hashed build constraints (below) need 0.12.16; CI and the images run 0.12.23.
required-version = ">=0.12.16"
default-groups = "all"
# Only CPython runs Harmony; the lock skips other implementations' forks.
environments = ["platform_python_implementation == 'CPython'"]
# `uv sync` builds 22 packages from source (2 git, 20 sdists), all with setuptools.
# Their build tools are pinned here with hashes, recorded in uv.lock and enforced
# by --locked (hashed entries need uv 0.12.16 or later). The list is every build
# requirement a fresh-cache `uv sync --locked -v` installs.
build-constraint-dependencies = [
    { requirement = "setuptools==82.0.1", hashes = [
        "sha256:a59e362652f08dcd477c78bb6e7bd9d80a7995bc73ce773050228a348ce2e5bb",
        "sha256:7d872682c5d01cfde07da7bccc7b65469d3dca203318515ada1de5eda35efbf9",
    ] },
]

[tool.uv.sources]
Flask-Potion = { git = "https://github.com/Zenysis/potion.git", rev = "bd398c18e8710a4e7cc87d9abb6ba9a95e7ba792" }
pylib = { git = "https://github.com/room77/py77.git", rev = "70280110ec342a6f6db1c102e96756fcc3c3c01b" }

[tool.ruff]
line-length = 88
extend-exclude = ["web/public", "node_modules"]
# The web image still runs Python 3.8, so the formatter must not emit 3.9+ syntax
# (parenthesised with-statements) until WP-3b moves every image to 3.13. That
# includes tests, which builders and gates also run on the 3.8 web environment.
target-version = "py38"

[tool.ruff.per-file-target-version]
# Standalone tools on CPython 3.13 (PEP 723 scripts); the rest targets 3.8 (above)
# until WP-3b.
"prod/browser_share/**" = "py313"
"docker/export_requirements.py" = "py313"
"tests/infra/**" = "py313"

[tool.ruff.format]
# black --skip-string-normalization, which CI ran before ruff.
quote-style = "preserve"

[tool.ruff.lint]
# CI applies this set to the Python files a PR changes, and E9, F63, F7 and F82
# to the whole tree.
select = ["E4", "E7", "E9", "F", "S"]
# S603 and S607 flag every subprocess call, even a fixed argument list with no
# shell; the shell=True rules (S602, S604, S605) stay on.
ignore = ["S603", "S607"]

[tool.ruff.lint.per-file-ignores]
# Tests assert, draw synthetic data from `random`, use placeholder credentials and
# fixed temp paths, and name wildcard addresses (to assert nothing binds to them).
"tests/**" = ["S101", "S104", "S105", "S106", "S108", "S311"]

[tool.mypy]
files = [
    "web/server",
    "models",
    "db",
    "prod/browser_share/browser_share.py",
    "docker/export_requirements.py",
]
plugins = ["sqlmypy"]
ignore_missing_imports = false
show_error_codes = true
namespace_packages = true
explicit_package_bases = true
# Always on under the mypy daemon, so on here too for the same results.
local_partial_types = true

[[tool.mypy.overrides]]
module = ["models.python.dashboard.*", "web.server.migrations.*"]
ignore_errors = true

[[tool.mypy.overrides]]
# The standalone tools are checked as `mypy --strict` would, minus its two global
# flags (warn_unused_configs, warn_redundant_casts), which mypy cannot scope.
module = ["prod.browser_share.browser_share", "docker.export_requirements"]
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
warn_unused_ignores = true
warn_return_any = true
implicit_reexport = false
strict_equality = true

[[tool.mypy.overrides]]
# config.* is loaded dynamically per deployment; the rest ship no type information.
module = [
    "config.*",
    "flask_potion.*",
    "flask_user.*",
    "flask_principal.*",
    "flask_login.*",
    "flask_migrate.*",
    "flask_sqlalchemy.*",
    "related.*",
    "slugify.*",
    "pydruid.*",
    "alembic.*",
    "pylib.*",
    "past.*",
    "future.*",
    "hvac.*",
    "toposort.*",
    "stringcase.*",
    "wtforms.*",
    "celery.*",
    "twilio.*",
    "ethiopian_date.*",
    "scipy.*",
    "psycopg2.*",
    "pandas.*",
    "_pypyjson.*",
    "factory.*",
    "alchemy_mock.*",
    "ijson.*",
    "rapidjson.*",
    "flask_jwt_extended.*",
    "boto3.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
# CI runs every directory under tests/ (ci/pytest_suites.sh, one process each),
# so a new suite needs no workflow change.
testpaths = ["tests"]
# pytest-flask (dev group) pushes a request context around any test with an `app`
# fixture, so Flask-Login state leaks into tests/web. No suite uses it.
addopts = "-p no:flask"
markers = [
    "stack: needs the running docker compose stack; CI's unit job deselects it",
]
