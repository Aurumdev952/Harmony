[project]
name = "harmony"
version = "0"
# The CI and dev interpreter. WP-3b moves everything to CPython 3.13 by changing
# this line to "==3.13.*" and running `uv lock` (plus whatever pins 3.13 forces).
requires-python = "==3.9.*"
# Shared by the web server and the pipeline (exported to requirements.txt).
dependencies = [
    "setuptools==71.1.0",
    "attrs==21.4.0",
    # Also pinned in the Dockerfiles; some installs need wheel before anything else.
    "wheel==0.43.0",
    "Cython<3.0.0",
    "celery==5.4.0",
    "Werkzeug==0.16.1",
    "MarkupSafe==0.23",
    "Flask==1.0.1",
    "Flask-Principal==0.4.0",
    "Flask-Migrate==2.5.2",
    "Flask-SQLAlchemy==2.4.0",
    "flask-user==0.6.21 ; platform_python_implementation != 'PyPy'",
    "WTForms==2.1",
    # Flask 1.0.1 needs Jinja2 2.10.1.
    "Jinja2==2.10.1",
    # Later releases removed itsdangerous.json, which Flask 1.0.1 imports.
    "itsdangerous==2.0.1",
    "importlib_metadata<5",
    "ethiopian-date-converter==0.1.5",
    "hvac>=0.7.0",
    "pandas>=1.3,<2.0 ; platform_python_implementation != 'PyPy'",
    "psycopg2-binary==2.8.5 ; platform_python_implementation != 'PyPy'",
    "python-Levenshtein==0.12.1",
    "python-dateutil>=2.8.1",
    "requests==2.28.1 ; platform_python_implementation != 'PyPy'",
    "httpx[socks]==0.27.0",
    "six>=1.9.0",
    "stringcase==1.2.0",
    "toposort==1.5",
    "coloredlogs==5.0",
    "python-slugify",
    "retry>=0.9.2",
    "watchdog>=0.8.3",
    "pyyaml>=3.12",
    "boto3==1.16.25",
    "SQLAlchemy==1.3.24",
    "related>=0.7.0",
    "gspread>=5.4.0",
    # Does not install on PyPy (needs grpcio).
    "google-cloud-logging==1.11.0 ; platform_python_implementation != 'PyPy'",
    # numpy 1.16.0-1.16.2 break on PyPy, and 1.21.0 has no PyPy build.
    "numpy==1.21.0 ; platform_python_implementation != 'PyPy'",
    "numpy==1.15.4 ; platform_python_implementation == 'PyPy'",
    "python-nginx==1.2",
    # Our fork fixes response-schema inference from type annotations. The pipeline
    # needs it too, through the alerts code.
    "Flask-Potion",
    "pylib",
    "pydruid",
    "python-rapidjson==1.9",
    "openpyxl>=3.0.9",
    # Works around https://github.com/lloyd/yajl/issues/130.
    "ijson-bigint==3.2.0.post1",
    "types-jsonschema==4.17.0.8",
    "future==0.18.3",
]

[dependency-groups]
# Exported to requirements-web.txt.
web = [
    "Flask-Admin==1.5.3",
    "graphene-sqlalchemy==2.3.0",
    "Flask-GraphQL==2.0.1",
    "flask-jwt-extended==3.25.1",
    "blinker==1.4",
    "flask-caching==2.0.1",
    "flask-login==0.4.1",
    "gunicorn[gevent]==20.0.4",
    "isodate>=0.5.4",
    "redis==5.0.1",
    "scipy>=1.2.1",
    "twilio==6.24.1",
    "PyJWT==1.7.1",
    "typing_extensions==4.1.1",
    "alembic>=1.7.1",
    "segment-analytics-python==2.2.3",
]
# Exported to requirements-pipeline.txt.
pipeline = [
    "xlrd>=1.0.0",
    "pyshp",
    # shapely 2.0 needs numpy 1.19, above the PyPy numpy pin.
    "shapely==1.8",
    "pyproj==3.4.1",
    "contextlib2",
    "lxml ; platform_python_implementation != 'PyPy'",
    "savReaderWriter ; platform_python_implementation != 'PyPy'",
    "oauthlib",
    "requests_oauthlib",
    "fuzzywuzzy",
    "jellyfish==0.7.2",
    "isoweek",
    "unidecode==1.1.1",
    "zeep==3.4.0 ; platform_python_implementation != 'PyPy'",
    "scikit-learn>=0.21.3 ; platform_python_implementation != 'PyPy'",
    "scipy>=1.2.1 ; platform_python_implementation != 'PyPy'",
    "typing_extensions==4.1.1",
    "netCDF4 ; platform_python_implementation != 'PyPy'",
    "dataclasses",
    "editdistance",
    "croniter==1.3.7",
    "dask==2022.2.0 ; platform_python_implementation != 'PyPy'",
    "lz4==4.3.2 ; platform_python_implementation != 'PyPy'",
]
# Exported to requirements-dev.txt.
dev = [
    # Paramiko and its dependencies (used by Fabric).
    "cryptography==37.0.2",
    "pyasn1==0.4.8",
    "PyNaCl==1.4.0",
    "paramiko==2.7.1",
    "pytest>=7.4.3",
    "pytest-selenium==4.0.1",
    "selenium==4.5.0",
    "pytest-flask>=0.15.0",
    "pytest-xdist>=1.29.0",
    "pytest-metadata>=1.8.0",
    "junit-xml>=1.9",
    "deepdiff==5.5.0",
    "ordered-set==4.0.2",
    "pytest-asyncio==0.20.3",
    "pytest-httpx==0.30.0",
    "freezegun>=1.5",
    "pip-licenses==1.7.1",
    "termcolor==1.1.0",
    "googlemaps==4.2.0",
    "geopy==2.1.0",
    "ruff==0.16.10",
    "PyInstaller>=3.4",
    "pytest-env==0.6.2",
    "coverage==5.2.1",
    "pytest-picked==0.4.4",
    "mypy==1.3",
    "sqlalchemy-stubs==0.4",
    "types-botocore==1.0.2",
    "types-certifi==0.1.3",
    "types-Flask==0.1.2",
    "types-Jinja2==0.1.3",
    "types-jwt==0.1.3",
    "types-python-dateutil==0.1.2",
    "types-redis==0.1.17",
    "types-requests==0.1.8",
    "types-Werkzeug==0.1.8",
    "testfixtures==6.17.1",
    "alchemy-mock==0.4.3",
    "factory-boy==3.2.0",
]

[tool.uv]
package = false
default-groups = "all"
# The lock serves CI and development on CPython. The pipeline image's PyPy venv
# installs from requirements*.txt until PyPy goes (WP-8d).
environments = ["platform_python_implementation == 'CPython'"]
# Lock-only: 2.8.5 has no CPython 3.9 wheel and needs libpq headers to build.
# requirements.txt keeps 2.8.5 for the images (the web image is CPython 3.8).
override-dependencies = [
    "psycopg2-binary==2.8.6 ; platform_python_implementation != 'PyPy'",
]

[tool.uv.sources]
Flask-Potion = { git = "https://github.com/Zenysis/potion.git", rev = "bd398c18e8710a4e7cc87d9abb6ba9a95e7ba792" }
pylib = { git = "https://github.com/room77/py77.git", rev = "70280110ec342a6f6db1c102e96756fcc3c3c01b" }
pydruid = { git = "https://github.com/druid-io/pydruid.git", rev = "2420109553812470ed4d91cd0f8d5e70bbf2cfd3" }

[tool.ruff]
line-length = 88
extend-exclude = ["web/public", "node_modules"]

[tool.ruff.per-file-target-version]
# Standalone tools on CPython 3.13 (PEP 723 scripts); the rest targets 3.9 from
# requires-python until WP-3b.
"prod/browser_share/**" = "py313"
"docker/export_requirements.py" = "py313"
"tests/infra/**" = "py313"

[tool.ruff.format]
# black --skip-string-normalization, which CI ran before ruff.
quote-style = "preserve"

[tool.ruff.lint]
# CI applies this set to the Python files a PR changes, and E9, F63, F7 and F82
# to the whole tree.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Undefined names that are real bugs, left to their owners (WP-2f Requests).
"scripts/druid/druid_task_memory_stats.py" = ["F821"]
"util/unix.py" = ["F821"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
