# The browser entry point of the perf stack (scripts/perf/dashboards.mjs).
# Production puts nginx in front of gunicorn (prod/nginx/nginx_vhost_default_location):
# it serves the built client and static files itself and gzips responses. This
# server does the same with that file's gzip settings. The app runs without
# ZEN_PROD, so its templates ask for /build/<name> and not the checksummed
# /build/min/ paths; those names are served from the production build, which
# `stack.sh client` stages with unhashed aliases.
server {
    listen 8080;

    location ^~ /build/ {
        alias /srv/build/;
        add_header Cache-Control "public";
    }

    location ~* ^/(js|images)/ {
        root /srv/public;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://web:5000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 600;
        proxy_send_timeout 600;
    }

    send_timeout 600;
    client_max_body_size 256M;
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_proxied any;
    gzip_types text/html text/plain text/css text/xml application/xml application/xml+rss application/javascript application/x-javascript application/json text/javascript;
}
