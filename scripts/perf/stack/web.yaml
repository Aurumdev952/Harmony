# Web side of the performance stack: the WP-2c contract stack's shape
# (tests/contract/stack/compose.yaml on mig/WP-2c-api-contract-recordings)
# pointed at the real Druid of druid.override.yaml instead of a stand-in.
# Start it with scripts/perf/stack.sh, which builds the image and generates
# every secret below into a mode-600 file outside the repository.
#
# Differences from the contract stack:
# - ZEN_OFFLINE is unset and DRUID_HOST is the `druid` forwarder on the
#   Druid project's internal web network.
# - gunicorn runs the docker-compose.yaml default of 4 gevent workers.
# - web is published on loopback directly, without a forwarder in the
#   measured path, so it sits on a routable network.
# - no mail sink: nothing in the baseline sends mail.
# - a `ui` nginx in front of web for the browser measurements.
name: ${PERF_PROJECT:?run scripts/perf/stack.sh}-web

x-web-env: &web-env
  ZEN_ENV: harmony_demo
  ZEN_HOME: /zenysis
  PYTHONPATH: /zenysis
  PYTHONDONTWRITEBYTECODE: "1"
  DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?}@postgres:5432/harmony_demo-local
  SQLALCHEMY_DATABASE_URI: postgresql://postgres:${POSTGRES_PASSWORD:?}@postgres:5432/harmony_demo-local
  POSTGRES_HOST: postgres
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
  REDIS_HOST: redis
  REDIS_PASSWORD: ${REDIS_PASSWORD:?}
  HASURA_HOST: http://hasura:8080
  HASURA_ADMIN_SECRET: ${HASURA_ADMIN_SECRET:?}
  DRUID_HOST: http://druid
  DEFAULT_SECRET_KEY: ${DEFAULT_SECRET_KEY:?}
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:?}
  EMAIL_HOST: mail.invalid
  EMAIL_PORT: "1025"
  EMAIL_HOST_USER: perf-mailer@harmony.invalid
  EMAIL_HOST_PASSWORD: perf-mail-sink
  EMAIL_USE_ENCRYPTION: none

networks:
  internal:
    internal: true
  druid:
    name: ${PERF_PROJECT:?}-druid-web
    external: true
  edge: {}

volumes:
  share:
    name: ${PERF_PROJECT:?}-share
    external: true

services:
  postgres:
    image: postgres:15.2-alpine@sha256:d9c304353c031b21e9a7e33dc4781e272a9fa802a2ab9703fe4199d72ba1422c
    networks: [internal]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: harmony_demo-local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d harmony_demo-local"]
      interval: 5s
      timeout: 5s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data

  redis:
    image: redis:7-alpine@sha256:520775a41a63e77e06c73e35d2fd9cc15921a609516818796b4ecbb813078bc7
    networks: [internal]
    command: redis-server ${PERF_REDIS_ARGS:-}

  web-init:
    image: ${PERF_WEB_IMAGE:?}
    networks: [internal, druid]
    working_dir: /zenysis
    volumes:
      - ${PERF_REPO_ROOT:?}:/zenysis:ro
    environment:
      <<: *web-env
      PERF_USERNAME: ${PERF_USERNAME:?}
      PERF_PASSWORD: ${PERF_PASSWORD:?}
    command: ["/bin/bash", "/zenysis/scripts/perf/stack/init.sh"]
    depends_on:
      postgres:
        condition: service_healthy

  hasura:
    image: hasura/graphql-engine:v2.11.3.cli-migrations-v2@sha256:5e75080f938a7f1a59eabae857306eb41c7aff04fd7d2875a942e087716d187f
    networks: [internal]
    environment:
      HASURA_GRAPHQL_ENABLE_TELEMETRY: "false"
      HASURA_GRAPHQL_DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?}@postgres:5432/harmony_demo-local
      HASURA_GRAPHQL_ADMIN_SECRET: ${HASURA_ADMIN_SECRET:?}
    depends_on:
      web-init:
        condition: service_completed_successfully

  web:
    image: ${PERF_WEB_IMAGE:?}
    networks: [internal, druid, edge]
    working_dir: /zenysis
    volumes:
      - ${PERF_REPO_ROOT:?}:/zenysis:ro
    environment:
      <<: *web-env
      ZEN_GUNICORN_WORKER_THREADS: "4"
    command: ["python", "web/gunicorn_server.py", "--timeout=600"]
    ports:
      - 127.0.0.1:${PERF_WEB_PORT:?}:5000
    depends_on:
      web-init:
        condition: service_completed_successfully
      redis:
        condition: service_started
      hasura:
        condition: service_started

  # The browser's entry point (ui.nginx.conf): the built client and static
  # files from nginx, everything else proxied to web. Started by `stack.sh ui`.
  ui:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    profiles: [ui]
    networks: [internal, edge]
    volumes:
      - ${PERF_STACK_DIR:?}/ui.nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${PERF_SCRATCH:?}/client:/srv/build:ro
      - ${PERF_REPO_ROOT:?}/web/public:/srv/public:ro
    ports:
      - 127.0.0.1:${PERF_UI_PORT:?}:8080
    depends_on: [web]

  # One-off: `stack.sh index` runs the pipeline's index step with this.
  indexer:
    image: ${PERF_WEB_IMAGE:?}
    profiles: [index]
    networks: [druid]
    working_dir: /zenysis
    volumes:
      - ${PERF_REPO_ROOT:?}:/zenysis:ro
      - share:/home/share
      - ${PERF_SCRATCH:?}/pipeline/out:/pipeline-out:ro
    environment:
      ZEN_ENV: harmony_demo
      ZEN_HOME: /zenysis
      PYTHONPATH: /zenysis
      PYTHONDONTWRITEBYTECODE: "1"
      DRUID_HOST: http://druid
      DEFAULT_SECRET_KEY: ${DEFAULT_SECRET_KEY:?}
    command: ["/bin/bash", "/zenysis/scripts/perf/stack/index.sh"]
