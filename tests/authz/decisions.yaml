  - {check: [create_resource, source_config, null], used_by: "Potion source_config create", allow: [tag:superuser]}
  - {check: [edit_resource, source_config, null], used_by: "Potion source_config update", allow: [tag:superuser]}
  - {check: [delete_resource, source_config, null], used_by: "Potion source_config delete", allow: [tag:superuser]}
